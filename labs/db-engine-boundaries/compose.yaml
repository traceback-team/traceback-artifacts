name: traceback-db-engine-lab

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab-postgres
      POSTGRES_DB: engine_lab
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d engine_lab"]
      interval: 2s
      timeout: 3s
      retries: 30

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: lab-mysql-root
      MYSQL_DATABASE: engine_lab
      MYSQL_USER: lab
      MYSQL_PASSWORD: lab-mysql
    command: ["--default-storage-engine=InnoDB"]
    ports:
      - "127.0.0.1:53306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 2s
      timeout: 5s
      retries: 40

  source-inspector:
    profiles: ["source"]
    build:
      context: .
      dockerfile: Dockerfile.source-inspector
    volumes:
      - source-data:/workspace/sources
    command: ["sleep", "infinity"]

volumes:
  postgres-data:
  mysql-data:
  source-data:
