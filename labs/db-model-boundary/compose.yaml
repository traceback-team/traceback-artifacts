name: traceback-db-model-boundary

services:
  postgres:
    image: postgres:18.6
    command: ["postgres", "-c", "shared_buffers=512MB", "-c", "synchronous_commit=on"]
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab-postgres
      POSTGRES_DB: model_lab
    ports:
      - "127.0.0.1:56432:5432"
    mem_limit: 2g
    cpus: 2.0
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d model_lab"]
      interval: 2s
      timeout: 3s
      retries: 40

  mongo:
    image: mongo:7.0.41-jammy
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.5", "--setParameter", "diagnosticDataCollectionEnabled=false"]
    ports:
      - "127.0.0.1:58017:27017"
    mem_limit: 2g
    cpus: 2.0
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ping:1}).ok"]
      interval: 2s
      timeout: 5s
      retries: 40

  replica-init:
    image: mongo:7.0.41-jammy
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    entrypoint: ["mongosh", "--quiet", "mongodb://mongo:27017/admin", "--eval"]
    command:
      - >-
        try { rs.status().ok }
        catch (error) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }

  benchmark:
    build: ./benchmark
    depends_on:
      postgres:
        condition: service_healthy
      replica-init:
        condition: service_completed_successfully
    environment:
      PG_URL: postgresql://lab:lab-postgres@postgres:5432/model_lab
      MONGODB_URI: mongodb://mongo:27017/?replicaSet=rs0
      ORDER_COUNT: ${ORDER_COUNT:-30000}
      ITEMS_PER_ORDER: ${ITEMS_PER_ORDER:-5}
      READ_ITERATIONS: ${READ_ITERATIONS:-100}
      WRITE_ITERATIONS: ${WRITE_ITERATIONS:-50}
    volumes:
      - ./results:/results

volumes:
  postgres-data:
  mongo-data:
